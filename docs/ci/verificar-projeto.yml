name: Verificar projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Conferir arquivos e links
        run: python tools/verify_publication.py
      - name: Instalar dependências para CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Testar invariantes científicos
        run: python -m pytest -q
      - name: Conferir direção e saídas do Qwen, sem GPU
        run: python verify_qwen_improved.py
