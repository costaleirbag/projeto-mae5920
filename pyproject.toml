[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment-lab"
version = "0.1.0"
description = "Reproducible IMDb experiments: TF-IDF, CNN, BERT and frozen Qwen3-8B RFM steering"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5,<3", "transformers>=4.51,<5", "datasets>=3,<5",
  "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "pandas>=2.2,<3",
  "numpy>=1.26,<3", "matplotlib>=3.9,<4", "sentence-transformers>=3,<6",
  "psutil>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8",
  "reportlab>=4,<5", "pypdf>=5,<7", "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
